            has:
              kind: identifier
              regex: 'Trigger$'
    # ä¸åœ¨ <Link> æˆ– <a> å†…éƒ¨ï¼ˆç”±çˆ¶çº§æä¾›å¯¼èˆªäº¤äº’ï¼‰
