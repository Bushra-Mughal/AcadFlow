id: require-button-interaction
language: Tsx
files:
  - src/**/*.tsx
  - src/**/*.jsx
rule:
  kind: jsx_opening_element
  all:
    # å¿…é¡»æ˜¯ <Button> ç»„ä»¶
    - has:
        kind: identifier
        regex: '^Button$'
    # æ²¡æœ‰ onClick
    - not:
        has:
          kind: jsx_attribute
          has:
            kind: property_identifier
            regex: '^onClick$'
    # æ²¡æœ‰ asChild
    - not:
        has:
          kind: jsx_attribute
          has:
            kind: property_identifier
            regex: '^asChild$'
    # æ²¡æœ‰ type="submit" æˆ– type="reset"
    - not:
        has:
          kind: jsx_attribute
          all:
